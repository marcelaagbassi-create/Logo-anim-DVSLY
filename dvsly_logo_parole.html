<script>
  const turb = document.getElementById('turb');
  const disp = document.getElementById('disp');
  const glowBlur = document.getElementById('glowBlur');
  const halo = document.getElementById('halo');

  let t = 0;
  let amp = 0;
  let speaking = false;
  let freqPhase = 0;

  // ---- demo autonome : bascule automatiquement entre "repos" et "parole" ----
  // en prod, `speaking` doit etre pilote par la vraie detection vocale (micro/TTS), pas un minuteur
  let cycleTimer = 0, cycleDuration = 3.2;
  function updateSpeakingCycle(dt){
    cycleTimer += dt;
    if(cycleTimer > cycleDuration){
      cycleTimer = 0;
      speaking = !speaking;
      cycleDuration = speaking ? (1.8 + Math.random()*1.2) : (3 + Math.random()*2);
    }
  }

  function loop(){
    const dt = 0.016;
    t += dt;
    updateSpeakingCycle(dt);

    if(speaking){
      // ---- PAROLE : le logo se fige nettement sur sa forme d'origine ----
      amp += (0 - amp) * 0.4;
      if(amp < 0.004) amp = 0;
    } else {
      // ---- REPOS : le logo est vivant, deformation clairement visible ----
      const targetAmp = 0.42 + Math.abs(Math.sin(t*0.7)) * 0.30 + Math.sin(t*1.9)*0.08;
      amp += (targetAmp - amp) * 0.045;

      freqPhase += 0.004;
      const bf1 = 0.014 + Math.sin(freqPhase) * 0.006;
      const bf2 = 0.035 + Math.cos(freqPhase*1.3) * 0.012;
      turb.setAttribute('baseFrequency', bf1.toFixed(4) + ' ' + bf2.toFixed(4));
      turb.setAttribute('seed', (2 + Math.sin(t*0.25)*2.2).toFixed(2));
    }

    const dispScale = amp * 90;
    disp.setAttribute('scale', dispScale.toFixed(1));

    glowBlur.setAttribute('stdDeviation', (1.2 + amp * 5).toFixed(2));
    halo.style.opacity = speaking ? '0.2' : (0.35 + amp * 0.4).toFixed(2);
    halo.style.transform = `scale(${(1 + amp*0.12).toFixed(3)})`;

    requestAnimationFrame(loop);
  }
  loop();
</script>
